<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8" />
      <title>Aris Manager</title>
      <style>
          * {
              margin: 0;
              padding: 0;
          }

          html, body {
              width: 100vw;
              height: 100vh;
              overflow: hidden;
          }

          .splash-container {
              height: 100vh;
              width: 100vw;
              display: flex;
              justify-content: center;
              align-items: center;
              background-image: url('./Interface.png');
              background-size: cover;
              background-repeat: no-repeat;
              background-position: center center;
              background-attachment: fixed;
              border-radius: 15pt;
          }

          .logo {
              user-select: none;
              -webkit-user-drag: none;
              pointer-events: none;
          }
      </style>
</head>
<body>
<div class="splash-container">
      <img src="icon.png" class="logo" alt="logo" />
</div>
</body>
</html>
